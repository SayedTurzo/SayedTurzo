name: Profile refresh
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches: [main]
    paths: ['profile.json', 'scripts/**', '.github/workflows/profile.yml']
permissions:
  contents: write
concurrency:
  group: profile-content
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow==11.3.0
      - run: python scripts/build_profile.py
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/contributions.svg?color_snake=#8dbd34
            assets/contributions-dark.svg?palette=github-dark&color_snake=#c5ff61
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Save generated profile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md assets site/profile.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh profile artwork and contribution snake'
            git pull --rebase origin main
            git push
          fi
