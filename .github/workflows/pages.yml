name: Publish playable portfolio
on:
  push:
    branches: [main]
    paths: ['site/**', 'profile.json', 'scripts/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: profile-content
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow==11.3.0
      - run: python scripts/build_profile.py
      - run: python scripts/check_release.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live page and activate README links
        run: |
          python scripts/activate_site.py
          python scripts/build_profile.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add profile.json site/profile.json site/index.html README.md assets
          if ! git diff --cached --quiet; then
            git commit -m 'Activate verified playable portfolio links'
            git pull --rebase origin main
            git push
          fi
